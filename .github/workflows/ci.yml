name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Install shellcheck and php
        run: sudo apt-get update && sudo apt-get install -y shellcheck php-cli

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Shellcheck (via Go test)
        run: go test ./internal/snapshot -run TestShellcheck -count=1

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.5
